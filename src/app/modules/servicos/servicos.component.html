<div class="page-header">
  <h1>✂️ Serviços</h1>
  <button *ngIf="podeCriar" class="btn btn-primary" (click)="novoServico()">+ Novo Serviço</button>
</div>

<div *ngIf="alertMessage" class="alert alert-{{alertType}}">
  {{ alertMessage }}
</div>

<div class="card">
  <div class="filters-bar">
    <input type="text" placeholder="Buscar por nome ou categoria..." [(ngModel)]="searchTerm"
      (input)="filtrarServicos()" class="search-input" />
    <select [(ngModel)]="categoriaFiltro" (change)="filtrarServicos()" class="filter-select">
      <option value="">Todas as categorias</option>
      <option *ngFor="let cat of categorias" [value]="cat">{{ cat }}</option>
    </select>
  </div>

  <div *ngIf="loading" class="loading">
    Carregando serviços...
  </div>

  <div *ngIf="!loading && servicosFiltrados.length === 0" class="empty-state">
    <p>Nenhum serviço encontrado.</p>
  </div>

  <div class="table-responsive">
    <table *ngIf="!loading && servicosFiltrados.length > 0" class="table">
      <thead>
        <tr>
          <th>Nome do Serviço</th>
          <th>Categoria</th>
          <th>Valor</th>
          <th>Duração</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let servico of servicosFiltrados">
          <td data-label="Serviço" class="wrap-text"><strong>{{ servico.nome }}</strong></td>
          <td data-label="Categoria">{{ servico.categoria }}</td>
          <td data-label="Valor" style="font-weight: 600;">{{ formatarMoeda(servico.valor_padrao) }}</td>
          <td data-label="Duração">{{ servico.duracao_estimada }} min</td>
          <td data-label="Status">
            <div [ngClass]="servico.ativo ? 'badge-success' : 'badge-danger'"
              style="width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px;"></div>
            <span>{{ servico.ativo ? 'Ativo' : 'Inativo' }}</span>
          </td>
          <td data-label="Ações">
            <div class="actions-container">
              <button *ngIf="podeEditar" class="btn-action-standard btn-edit" (click)="editarServico(servico.id!)"
                title="Editar">
                📝
              </button>
              <button *ngIf="podeExcluir" class="btn-action-standard btn-danger" (click)="excluirServico(servico.id!)"
                title="Excluir">
                🗑️
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
