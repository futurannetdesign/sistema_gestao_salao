<div class="page-header">
  <h1>👥 Clientes</h1>
  <button *ngIf="podeCriar" class="btn btn-primary" (click)="novoCliente()">+ Novo Cliente</button>
</div>

<div *ngIf="alertMessage" class="alert alert-{{alertType}}">
  {{ alertMessage }}
</div>

<div class="card">
  <div class="search-bar">
    <input type="text" placeholder="Buscar por nome ou celular..." [(ngModel)]="searchTerm" (input)="filtrarClientes()"
      class="search-input" />
  </div>

  <div *ngIf="loading" class="loading">
    Carregando clientes...
  </div>

  <div *ngIf="!loading && clientesFiltrados.length === 0" class="empty-state">
    <p>Nenhum cliente encontrado.</p>
  </div>

  <div class="table-responsive">
    <table *ngIf="!loading && clientesFiltrados.length > 0" class="table">
      <thead>
        <tr>
          <th style="width: 35%;">Nome do Cliente</th>
          <th style="width: 20%;">Contato</th>
          <th style="width: 25%;">WhatsApp / Ações Rápidas</th>
          <th style="width: 10%;">Gênero</th>
          <th style="width: 10%;">Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cliente of clientesFiltrados">
          <td class="wrap-text"><strong>{{ cliente.nome }}</strong></td>
          <td>
            <div style="font-size: 11px;">📱 {{ formatarTelefone(cliente.celular) }}</div>
            <div *ngIf="cliente.whatsapp" style="font-size: 11px; margin-top: 2px; opacity: 0.8;">💬 {{
              formatarTelefone(cliente.whatsapp) }}</div>
          </td>
          <td>
            <div class="actions-container" *ngIf="cliente.whatsapp || cliente.celular">
              <button class="btn-action-standard btn-success" (click)="abrirWhatsApp(cliente)" title="WhatsApp">
                💬
              </button>
              <button class="btn-action-standard btn-primary" (click)="enviarPromocao(cliente)" title="Promoção">
                🎉
              </button>
              <button class="btn-action-standard btn-warning" (click)="enviarBoleto(cliente)"
                title="Lembrete de Cobrança">
                💰
              </button>
            </div>
          </td>
          <td style="font-size: 11px;">{{ cliente.sexo || '-' }}</td>
          <td>
            <div class="actions-container">
              <button *ngIf="podeEditar" class="btn-action-standard btn-edit" (click)="editarCliente(cliente.id!)"
                title="Editar">
                📝
              </button>
              <button *ngIf="podeExcluir" class="btn-action-standard btn-danger" (click)="excluirCliente(cliente.id!)"
                title="Excluir">
                🗑️
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
